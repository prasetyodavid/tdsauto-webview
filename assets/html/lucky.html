<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky Number</title>

<style>
:root{
--bg:#0b0b0b;
--card:#121212;
--yellow:#f4c430;
--yellow2:#ffdd55;
--text:#f6f6f6;
--muted:#bdbdbd;
}

body{
margin:0;
font-family:Arial;
background:var(--bg);
color:var(--text);
text-align:center;
}

/* WRAP */
.wrap{
max-width:420px;
margin:auto;
padding:20px;
}

/* TITLE */
.title h1{
margin:0;
color:var(--yellow2);
}
.subtitle{
color:var(--muted);
margin-bottom:25px;
}

/* CARD SLOT */
.card{
background:var(--card);
border-radius:16px;
padding:20px;
border:1px solid rgba(244,196,48,.2);
}

/* SLOT */
.slot-area{
display:flex;
justify-content:center;
gap:10px;
margin-top:10px;
}

.reel{
width:60px;
height:80px;
background:#000;
border-radius:10px;
overflow:hidden;
border:1px solid rgba(244,196,48,.4);
box-shadow:0 0 10px rgba(244,196,48,.2) inset;
}

.reel-inner{
position:relative;
}

.number{
height:80px;
display:flex;
align-items:center;
justify-content:center;
font-size:32px;
font-weight:bold;
color:var(--yellow2);
text-shadow:0 0 10px rgba(244,196,48,.5);
}

/* BUTTON */
.spin{
margin-top:20px;
background:linear-gradient(#f7d55f,#d8a90b);
border:none;
padding:12px 30px;
border-radius:30px;
font-weight:bold;
cursor:pointer;
}

/* RESULT */
.result{
margin-top:20px;
font-size:18px;
color:var(--yellow2);
letter-spacing:5px;
}

/* JACKPOT */
.jackpot{
margin-top:15px;
font-size:22px;
color:gold;
display:none;
animation:blink 1s infinite alternate;
}
@keyframes blink{
from{opacity:0.5}
to{opacity:1}
}
</style>
</head>

<body>

<div class="wrap">

<div class="title">
<h1>Lucky Number</h1>
<div class="subtitle">Putar dan temukan angka keberuntunganmu</div>
</div>

<div class="card">

<div class="slot-area">
<div class="reel"><div class="reel-inner"></div></div>
<div class="reel"><div class="reel-inner"></div></div>
<div class="reel"><div class="reel-inner"></div></div>
<div class="reel"><div class="reel-inner"></div></div>
<div class="reel"><div class="reel-inner"></div></div>
</div>

<button class="spin" onclick="spin()">PUTAR</button>

</div>

</div>

<script>
const reels=document.querySelectorAll(".reel");
const inners=document.querySelectorAll(".reel-inner");
const digitHeight=80;

let spinning=false;

inners.forEach(inner=>{
let html="";
for(let i=0;i<100;i++){
html+=`<div class="number">${i%10}</div>`;
}
inner.innerHTML=html;
});

inner.style.transition = "none";
inner.style.transform = "translateY(0)";

function spin(){
  if(spinning) return;
  spinning=true;

  let results=[];

  for(let i=0;i<5;i++){
    results.push(Math.floor(Math.random()*10));
  }

  inners.forEach((inner,i)=>{

    // 🔥 RESET posisi dulu
    inner.style.transition = "none";
    inner.style.transform = "translateY(0)";

    let spins=30+Math.floor(Math.random()*20);
    let stopIndex=spins+results[i];
    let offset=stopIndex*digitHeight;

    setTimeout(()=>{
      inner.style.transition="transform 4s cubic-bezier(.17,.67,.12,.99)";
      inner.style.transform=`translateY(-${offset}px)`;
    },50 + i*300);

  });

  setTimeout(()=>{
    spinning=false;
  },4500);
}

</script>

</body>
</html>
