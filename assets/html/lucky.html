<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

html, body{
  min-height:100%;
}  

body{
margin:0;
background: linear-gradient(135deg, #0b112b, #1f2a6c, #5f2c82);
font-family:Arial;
color:white;
text-align:center;
overflow-x:hidden;
}

/* BACKGROUND */
.stars{
position:fixed;
width:100%;
height:100%;
background:url("https://www.transparenttextures.com/patterns/stardust.png");
opacity:.35;
animation:starsMove 80s linear infinite;
}

@keyframes starsMove{
from{background-position:0 0;}
to{background-position:1000px 1000px;}
}

/* CONTAINER */
.container{
position:relative;
z-index:2;
padding:40px 15px 120px;
min-height:100vh;
}

.title{
font-size:26px;
color:#ae00f3;
margin-bottom:10px;
}

.subtitle{
color:#aaa;
margin-bottom:30px;
}

/* SLOT */
.slot-frame{
display:flex;
justify-content:center;
padding:15px;
border-radius:20px;
border:2px solid #ae00f3;
box-shadow:0 0 25px #ae00f3;
background:#160a30;
max-width:420px;
margin:auto;
overflow:hidden;
}

.slot-area{
  display:flex;
  gap:6px;
  justify-content:center;
  flex-wrap:wrap; 
}

.reel{
flex:1;
width:60px;
height:80px;
background:#000;
border-radius:10px;
overflow:hidden;
border:2px solid #ae00f3;
}

.reel-inner{
position:relative;
}

.number{
height:80px;
display:flex;
align-items:center;
justify-content:center;
font-size:clamp(20px,5vw,30px);
font-weight:bold;
color:#ae00f3;
}

/* BUTTON */
.spin{
margin-top:30px;
background:linear-gradient(#c059e8,#ae00f3);
color:#000;
border:none;
padding:12px 30px;
border-radius:30px;
font-weight:bold;
cursor:pointer;
}

.spin:hover{
transform:scale(1.05);
}

/* JACKPOT */
.jackpot{
position:fixed;
top:45%;
left:50%;
transform:translate(-50%,-50%);
font-size:36px;
color:#ae00f3;
display:none;
}

/* NAVBAR BAWAH */
.navbar{
position:fixed;
bottom:0;
left:0;
right:0;
height:70px;
background:#111;
display:flex;
border-top:1px solid #333;
z-index:9999;
}

.nav-btn{
flex:1;
display:flex;
align-items:center;
justify-content:center;
font-size:12px;
color:#aaa;
cursor:pointer;
}

.nav-btn.active{
color:#ae00f3;
}

</style>

</head>

<body>

<div class="stars"></div>

<div class="container">

<div class="title">🍀 Lucky Number</div>
<div class="subtitle">Putar dan temukan angka keberuntunganmu</div>

<div class="slot-frame">
<div class="slot-area">

<div class="reel"><div class="reel-inner"></div></div>
<div class="reel"><div class="reel-inner"></div></div>
<div class="reel"><div class="reel-inner"></div></div>
<div class="reel"><div class="reel-inner"></div></div>
<div class="reel"><div class="reel-inner"></div></div>

</div>
</div>

<button class="spin" onclick="spin()">PUTAR ANGKA</button>

</div>

<!-- NAVBAR -->
<div class="navbar">
  <div class="nav-btn" onclick="location.href='result.html'">RESULT</div>
  <div class="nav-btn" onclick="location.href='bukumimpi.html'">BUKU MIMPI</div>
  <div class="nav-btn" onclick="location.href='index.html'">HOME</div>
  <div class="nav-btn" onclick="location.href='shio.html'">SHIO</div>
  <div class="nav-btn active" onclick="location.href='lucky.html'">LUCKY</div>
</div>

<script>

const reels=document.querySelectorAll(".reel");
const inners=document.querySelectorAll(".reel-inner");
const digitHeight=80;
let spinning=false;

inners.forEach(inner=>{
let html="";
for(let i=0;i<120;i++){
html+=`<div class="number">${i%10}</div>`;
}
inner.innerHTML=html;
});

function spin(){
if(spinning) return;
spinning=true;

let results=[];

for(let i=0;i<5;i++){
results.push(Math.floor(Math.random()*10));
}

inners.forEach((inner,i)=>{
let spins=40+Math.floor(Math.random()*20);
let stopIndex=spins+results[i];
let offset=stopIndex*digitHeight;

inner.style.transition="transform 4s ease-out";

setTimeout(()=>{
inner.style.transform=`translateY(-${offset}px)`;
},i*300);

});

setTimeout(()=>{
spinning=false;
},4500);
}


</script>

</body>
</html>
