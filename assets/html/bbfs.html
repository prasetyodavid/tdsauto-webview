<script>
function generateBBFS(){

    const startTime = performance.now();

    let input = document.getElementById("bbfsInput").value;
    let digit = parseInt(document.getElementById("digitType").value);
    let separator = document.getElementById("separator").value;

    input = input.replace(/[^0-9]/g, '');

    if(input.length < digit){
        alert("Jumlah angka tidak cukup!");
        return;
    }

    // Hitung stok angka
    let count = {};
    for(let num of input){
        count[num] = (count[num] || 0) + 1;
    }

    let uniqueNumbers = Object.keys(count);
    let results = [];

    function permute(temp = [], localCount = {...count}){

        if(temp.length === digit){
            results.push(temp.join(''));
            return;
        }

        for(let num of uniqueNumbers){

            if(localCount[num] > 0){

                localCount[num]--;
                temp.push(num);

                permute(temp, localCount);

                temp.pop();
                localCount[num]++;
            }
        }
    }

    permute();

    let finalResult = results.join(separator) + separator;

    const endTime = performance.now();

    document.getElementById("resultArea").value = finalResult;

    // Optional: tampilkan jumlah & waktu
    console.log("Jumlah LN:", results.length);
    console.log("Waktu:", (endTime - startTime).toFixed(2), "ms");
}

function copyResult(){

let textArea = document.getElementById("resultArea");

if(textArea.value === ""){
alert("Belum ada hasil untuk disalin!");
return;
}

textArea.select();
textArea.setSelectionRange(0, 99999);

document.execCommand("copy");

alert("Hasil BBFS berhasil disalin!");

}
</script>
