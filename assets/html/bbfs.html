<!DOCTYPE html>

<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BBFS</title>

<style>

:root{
--bg:#0b0b0b;
--card:#121212;
--yellow:#f4c430;
--yellow2:#ffdd55;
--text:#f6f6f6;
--muted:#bdbdbd;
}

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial;
background:var(--bg);
color:var(--text);
padding-bottom:80px;
}


/* CONTENT */

.wrap{
max-width:600px;
margin:auto;
padding:20px;
}

/* CARD */

.card{
background:#121212;
border:1px solid rgba(244,196,48,.18);
border-radius:16px;
padding:20px;
margin-bottom:20px;
}

/* TITLE */

.title{
text-align:center;
margin-bottom:15px;
}

.title h1{
margin:0;
font-size:28px;
color:var(--yellow2);
}

.title p{
color:var(--muted);
font-size:12px;
}

/* INPUT */

input{
width:100%;
padding:18px;
font-size:26px;
text-align:center;
background:#0f0f0f;
border:2px dashed var(--yellow);
border-radius:12px;
color:white;
letter-spacing:6px;
}

/* TYPE BUTTON */

.type{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:10px;
margin-top:15px;
}

.type button{
padding:14px;
border-radius:10px;
background:#1b1b1b;
border:1px solid #333;
color:#aaa;
font-weight:bold;
cursor:pointer;
}

.type button.active{
background:linear-gradient(#f7d55f,#d8a90b);
color:#111;
}

/* BUTTON */

.btn{
width:100%;
padding:16px;
border:none;
border-radius:12px;
background:linear-gradient(#f7d55f,#d8a90b);
font-weight:bold;
color:#111;
cursor:pointer;
margin-top:20px;
}

.btn-reset{
background:#222;
color:#ccc;
margin-top:10px;
}

/* RESULT */

.resultBox{
background:#111;
border-radius:12px;
padding:15px;
border:1px solid #333;
}

#outputResult{
width:100%;
height:160px;
background:#0d0d0d;
border:1px solid #333;
color:var(--yellow2);
font-family:monospace;
font-size:16px;
padding:10px;
resize:none;
border-radius:8px;
}

.copyBtn{
margin-top:10px;
padding:12px;
width:100%;
background:linear-gradient(#f7d55f,#d8a90b);
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
color:#111;
}


/* BUTTON KUNJUNGI */
.visit-btn{
padding:8px 14px;
background:linear-gradient(#f7d55f,#d8a90b);
border:none;
border-radius:8px;
font-weight:bold;
color:#000;
cursor:pointer;
}

/* POPUP */
.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.7);
display:none;
align-items:center;
justify-content:center;
z-index:9999;
}

.popup.active{
display:flex;
}

.popup-box{
background:#111;
padding:20px;
border-radius:12px;
text-align:center;
width:90%;
max-width:320px;
border:1px solid rgba(244,196,48,.3);
}

.popup-box p{
margin-bottom:20px;
font-size:14px;
}

.popup-actions{
display:flex;
gap:10px;
}

.popup-actions button{
flex:1;
padding:10px;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.btn-cancel{
background:#222;
color:#ccc;
}

.btn-ok{
background:linear-gradient(#f7d55f,#d8a90b);
color:#000;
}

.popup-box{
animation:fadeIn .2s ease;
}

@keyframes fadeIn{
from{transform:scale(.9);opacity:0;}
to{transform:scale(1);opacity:1;}
}

.visit-wrap{
display:flex;
flex-direction:column;
align-items:flex-end;
line-height:1;
}

.partner-text{
font-size:10px;
color:var(--yellow2);
opacity:.8;
margin-bottom:3px;
letter-spacing:.5px;
}
</style>

</head>

<body>

<div class="wrap">

<div class="title">
<h1>Generator BBFS</h1>
</div>

<div class="card">

<label><Strong>Masukkan Angka</strong></label>

<input type="text" id="inputAngka" placeholder="0123456789" maxlength="10">

<div class="type">
<button onclick="setTipe(4)" id="btn4D" class="active">4D</button>
<button onclick="setTipe(3)" id="btn3D">3D</button>
<button onclick="setTipe(2)" id="btn2D">2D</button>
</div>

<button class="btn" onclick="generateBBFS()">GENERATE</button> <button class="btn btn-reset" onclick="resetAll()">RESET</button>

</div>

<div class="card resultBox">

<h3>Hasil Kombinasi <span id="labelHasil">4D</span></h3>

<textarea id="outputResult" readonly></textarea>

<button class="copyBtn" onclick="copyResult()">SALIN HASIL</button>

</div>

</div>

<script>

let currentTipe=4;

function setTipe(n){

currentTipe=n;

document.querySelectorAll(".type button").forEach(b=>b.classList.remove("active"));

document.getElementById("btn"+n+"D").classList.add("active");

document.getElementById("labelHasil").innerText=n+"D";

}

function generateBBFS(){

let input=document.getElementById("inputAngka").value;

if(input.length<currentTipe){
alert("Minimal "+currentTipe+" digit");
return;
}

let pool=input.split("");

let res=getPermutations(pool,currentTipe);

let unique=[...new Set(res)];

document.getElementById("outputResult").value=unique.join(" ");

}

function getPermutations(arr,len){

let result=[];
let used=new Array(arr.length).fill(false);

function backtrack(cur){

if(cur.length===len){
result.push(cur.join(""));
return;
}

for(let i=0;i<arr.length;i++){

if(used[i]) continue;

used[i]=true;

cur.push(arr[i]);

backtrack(cur);

cur.pop();

used[i]=false;

}

}

backtrack([]);

return result;

}

function copyResult(){

let txt=document.getElementById("outputResult");

txt.select();
document.execCommand("copy");

alert("Hasil disalin");

}

function resetAll(){

document.getElementById("inputAngka").value="";
document.getElementById("outputResult").value="";

}

</script>
</body>
</html>
