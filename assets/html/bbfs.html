<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BBFS Generator</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:Poppins, sans-serif;
background: linear-gradient(135deg,#0b112b,#1f2a6c,#5f2c82);
color:#fff;
padding-bottom:100px;
display:flex;
justify-content:center;
}

/* CONTAINER */
.content{
  max-width:420px;
  margin:0 auto;
  padding:20px 15px 100px;
}

/* BOX */
.generator-box{
width:100%;
background:linear-gradient(145deg,#111,#1c1c1c);
padding:20px;
border-radius:15px;
border:1px solid rgba(174,0,243,0.3);
box-shadow:0 0 15px rgba(174,0,243,0.1);
box-sizing:border-box;
}

/* INPUT */
.generator-box input,
.generator-box select,
textarea{
width:100%;
box-sizing:border-box;
padding:10px;
border-radius:8px;
background:#000;
color:#ae00f3;
border:1px solid rgba(174,0,243,0.3);
margin:5px 0;
}

/* BUTTON */
.generator-box button{
padding:10px;
border-radius:8px;
border:none;
background:linear-gradient(#c059e8,#ae00f3);
color:#000;
font-weight:bold;
cursor:pointer;
margin-top:8px;
width:100%;
}

/* TEXTAREA */
textarea{
width:100%;
height:180px;
margin-top:15px;
border-radius:10px;
background:#000;
color:#ae00f3;
border:1px solid rgba(174,0,243,0.3);
padding:10px;
resize:none;
}

/* NAVBAR */
.navbar{
position:fixed;
bottom:0;
left:0;
right:0;
height:70px;
background:#111;
display:flex;
border-top:1px solid #333;
z-index:9999;
}

.nav-btn{
flex:1;
display:flex;
align-items:center;
justify-content:center;
font-size:12px;
color:#aaa;
cursor:pointer;
}

.nav-btn.active{
color:#ae00f3;
}

</style>
</head>

<body>

<div class="content">

<div class="generator-box">

<h2 style="color:#ae00f3;">BBFS Generator</h2>

<label>Angka tarung dalam:</label>

<input type="text" id="bbfsInput" placeholder="Contoh: 123456">

<select id="digitType">
<option value="2">2D</option>
<option value="3">3D</option>
<option value="4">4D</option>
<option value="5">5D</option>
</select>

<select id="separator">
<option value="*">*</option>
<option value="#">#</option>
</select>

<button onclick="generateBBFS()">Generate</button>
<button onclick="clearBBFS()">Bersihkan</button>

<textarea id="resultArea"></textarea>

<button onclick="copyResult()">📋 Copy Hasil</button>

</div>

</div>

<!-- NAVBAR -->
<div class="navbar">
  <div class="nav-btn" onclick="location.href='result.html'">RESULT</div>
  <div class="nav-btn" onclick="location.href='bukumimpi.html'">BUKU MIMPI</div>
  <div class="nav-btn" onclick="location.href='index.html'">HOME</div>
  <div class="nav-btn" onclick="location.href='shio.html'">SHIO</div>
  <div class="nav-btn" onclick="location.href='lucky.html'">LUCKY</div>
</div>

<script>

function generateBBFS(){

    let input = document.getElementById("bbfsInput").value;
    let digit = parseInt(document.getElementById("digitType").value);
    let separator = document.getElementById("separator").value;

    input = input.replace(/[^0-9]/g, '');

    if(input.length < digit){
        alert("Jumlah angka tidak cukup!");
        return;
    }

    let count = {};
    for(let num of input){
        count[num] = (count[num] || 0) + 1;
    }

    let uniqueNumbers = Object.keys(count);
    let results = [];

    function permute(temp = [], localCount = {...count}){

        if(temp.length === digit){
            results.push(temp.join(''));
            return;
        }

        for(let num of uniqueNumbers){
            if(localCount[num] > 0){
                localCount[num]--;
                temp.push(num);
                permute(temp, localCount);
                temp.pop();
                localCount[num]++;
            }
        }
    }

    permute();

    document.getElementById("resultArea").value = results.join(separator) + separator;
}

function clearBBFS(){
    document.getElementById("bbfsInput").value="";
    document.getElementById("resultArea").value="";
}

function copyResult(){
    let textArea = document.getElementById("resultArea");

    if(textArea.value === ""){
        alert("Belum ada hasil!");
        return;
    }

    textArea.select();
    document.execCommand("copy");

    alert("Berhasil disalin!");
}

</script>

</body>
</html>
