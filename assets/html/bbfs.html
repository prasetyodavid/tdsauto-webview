    <script>
        /* Fungsi Bawaan UI */
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const isClosed = sidebar.classList.contains('-translate-x-full');

            if (isClosed) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                document.body.classList.add('no-scroll');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
                document.body.classList.remove('no-scroll');
                document.querySelectorAll('[id^="submenu-"]').forEach(el => el.classList.add('hidden'));
                document.querySelectorAll('[id^="arrow-"]').forEach(el => el.classList.remove('rotate-180'));
            }
        }

        function toggleSubmenu(id) {
            const submenu = document.getElementById('submenu-' + id);
            const arrow = document.getElementById('arrow-' + id);
            const isHidden = submenu.classList.contains('hidden');
            
            if (isHidden) {
                submenu.classList.remove('hidden');
                arrow.classList.add('rotate-180');
            } else {
                submenu.classList.add('hidden');
                arrow.classList.remove('rotate-180');
            }
        }

        let currentTipe = 4;
        const inputMain = document.getElementById('inputAngka');
        const output = document.getElementById('outputResult');
        const resultDiv = document.getElementById('resultContainer');
        const digitCounter = document.getElementById('digitCount');

        inputMain.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
            digitCounter.innerText = `${e.target.value.length} DIGIT`;
        });

        function setTipe(n) {
            currentTipe = n;
            document.querySelectorAll('.tipe-btn').forEach(btn => {
                btn.className = "tipe-btn py-4 rounded-xl border-2 border-slate-700 bg-slate-800 text-slate-400 font-black hover:border-slate-600 transition-all";
            });
            const activeBtn = document.getElementById(`btn${n}D`);
            activeBtn.className = "tipe-btn py-4 rounded-xl border-2 border-amber-500 grad-bg text-slate-900 font-black transition-all shadow-lg shadow-amber-500/20";
            document.getElementById('labelHasil').innerText = `${n}D`;
        }

        function generateBBFS() {
            let angkaStr = inputMain.value;
            if (angkaStr.length < currentTipe) {
                showMsg(`MINIMAL BUTUH ${currentTipe} DIGIT ANGKA UNTUK TIPE ${currentTipe}D!`);
                return;
            }

            let pool = angkaStr.split('');
            const results = getPermutations(pool, currentTipe);
            const uniqueResults = [...new Set(results)];
            
            output.value = uniqueResults.join(' ');
            document.getElementById('totalLine').innerText = `${uniqueResults.length} LINE`;
            resultDiv.classList.remove('hidden');
            resultDiv.scrollIntoView({ behavior: 'smooth' });
        }

        function getPermutations(arr, length) {
            let res = [];
            let used = new Array(arr.length).fill(false);

            function backtrack(current) {
                if (current.length === length) {
                    res.push(current.join(''));
                    return;
                }
                for (let i = 0; i < arr.length; i++) {
                    if (used[i]) continue;
                    used[i] = true;
                    current.push(arr[i]);
                    backtrack(current);
                    current.pop();
                    used[i] = false;
                }
            }
            backtrack([]);
            return res;
        }

        function copyResult() {
            if (!output.value) return;
            output.select();
            document.execCommand('copy');
            
            const btn = document.getElementById('copyBtn');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = ` TERSALIN!`;
            btn.classList.replace('grad-bg', 'bg-emerald-500');
            
            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.classList.replace('bg-emerald-500', 'grad-bg');
            }, 2000);
        }

        function resetAll() {
            inputMain.value = '';
            output.value = '';
            digitCounter.innerText = '0 DIGIT';
            resultDiv.classList.add('hidden');
        }

        function showMsg(text) {
            document.getElementById('msgText').innerText = text;
            document.getElementById('msgBox').classList.replace('hidden', 'flex');
        }

        function closeMsg() {
            document.getElementById('msgBox').classList.replace('flex', 'hidden');
        }
    </script>
</body>
</html>
