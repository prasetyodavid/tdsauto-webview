        const listContainer = document.getElementById('listContainer');
        const searchInput = document.getElementById('searchInput');

        const dataObjects = rawData.split('\n').filter(line => line.trim() !== '').map(line => {
            const parts = line.split(/(\d.*)/);
            return {
                text: parts[0].trim(),
                numbers: parts[1] ? parts[1].trim() : ""
            };
        });

        function renderList(items) {
            listContainer.innerHTML = '';
            if (items.length === 0) {
                document.getElementById('noResult').classList.remove('hidden');
                return;
            }
            document.getElementById('noResult').classList.add('hidden');

            items.forEach((item) => {
                const row = document.createElement('div');
                // text-sm dan padding diperkecil agar lebih compact
                row.className = "px-6 py-4 flex justify-between items-center hover:bg-white/5 transition-all group";
                row.innerHTML = `
                    <div class="font-bold text-orange-50 text-sm uppercase tracking-wide group-hover:text-orange-400 transition-colors">${item.text}</div>
                    <div class="flex items-center gap-3 bg-white/5 border border-white/5 px-4 py-2 rounded-xl group-hover:border-orange-500/40 transition-all">
                        <span class="text-orange-500 font-black text-lg">${item.numbers.split(' – ')[0] || ''}</span>
                        <span class="text-white/10 font-thin text-lg">/</span>
                        <span class="text-white/40 font-bold text-lg">${item.numbers.split(' – ')[1] || ''}</span>
                    </div>
                `;
                listContainer.appendChild(row);
            });
        }

        renderList(dataObjects);

        searchInput.addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            const filtered = dataObjects.filter(item => 
                item.text.toLowerCase().includes(val) || 
                item.numbers.includes(val)
            );
            renderList(filtered);
        });
    </script>
