    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Transisi halus untuk sidebar */
        .sidebar-transition {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        /* Efek Gradien Kustom */
        .bg-gradient-gold {
            background: linear-gradient(135deg, #00a1ff 0%, #00a1ff 100%);
        }
        .text-gradient-gold {
            background: linear-gradient(135deg, #00a1ff 0%, #00a1ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        /* Border Gradien untuk Header dan Navigasi */
        .border-gradient-blue-bottom {
            border-bottom: 2px solid;
            border-image-source: linear-gradient(90deg, transparent, #00a1ff, #00a1ff, #00a1ff, transparent);
            border-image-slice: 1;
        }
        
        .border-gradient-blue-top {
            border-top: 2px solid;
            border-image-source: linear-gradient(90deg, transparent, #00a1ff, #00a1ff, #00a1ff, transparent);
            border-image-slice: 1;
        }

        /* Mencegah scroll saat sidebar terbuka */
        .no-scroll {
            overflow: hidden;
        }
        
        /* Animasi rotasi untuk ikon dropdown */
        .rotate-180 {
            transform: rotate(180deg);
        }

        /* Menghilangkan outline biru & delay tap di mobile */
        * {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        /* State aktif saat ditekan (Mobile Native Feel) */
        .btn-active:active {
            background-color: rgba(255, 255, 255, 0.05);
            transform: scale(0.97);
        }
        
        .nav-item-active:active {
            opacity: 0.6;
            transform: scale(0.95);
        }
		
        /* Efek Gradien untuk Teks Judul */
        .gradient-text {
            background: linear-gradient(to right, #00a1ff, #3de7fa, #6af3f3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-block;
        }

        /* Container galeri dirampingkan untuk mobile */
        .gallery-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            background-color: #000;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        /* Menghilangkan celah antar gambar */
        img {
            display: block;
            width: 100%;
            height: auto;
            border: none;
            margin: 0;
            padding: 0;
        }

        .header-section {
            background-color: #ffffff;
            width: 100%;
            text-align: center;
            padding: 2rem 1rem;
            border-bottom: 1px solid #1e293b;
        }

        .footer {
            padding: 30px 20px;
            color: #475569;
            text-align: center;
            font-size: 0.75rem;
            background-color: #020617;
            width: 100%;
        }

        /* Custom scrollbar lebih tipis */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #00a1ff;
            border-radius: 10px;
        }		
    </style>
</head>

    <script>
        /* Fungsi Bawaan UI */
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const isClosed = sidebar.classList.contains('-translate-x-full');

            if (isClosed) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                document.body.classList.add('no-scroll');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
                document.body.classList.remove('no-scroll');
                document.querySelectorAll('[id^="submenu-"]').forEach(el => el.classList.add('hidden'));
                document.querySelectorAll('[id^="arrow-"]').forEach(el => el.classList.remove('rotate-180'));
            }
        }

        function toggleSubmenu(id) {
            const submenu = document.getElementById('submenu-' + id);
            const arrow = document.getElementById('arrow-' + id);
            const isHidden = submenu.classList.contains('hidden');
            
            if (isHidden) {
                submenu.classList.remove('hidden');
                arrow.classList.add('rotate-180');
            } else {
                submenu.classList.add('hidden');
                arrow.classList.remove('rotate-180');
            }
        }

        /* Logika Galeri Gambar */
        const baseUrl = "https://galpagehoki.com/05/";
        const gallery = document.getElementById('gif-gallery');

        function loadImages() {
            for (let i = 0; i <= 99; i++) {
                const id = i.toString().padStart(2, '0');
                const fileName = id + ".gif";
                
                const img = document.createElement('img');
                img.src = baseUrl + fileName;
                img.alt = "Buku Mimpi 2D No " + id;
                img.loading = "lazy";
                
                gallery.appendChild(img);
            }
        }

        window.onload = loadImages;
    </script>
