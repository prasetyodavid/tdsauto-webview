    <style>
        /* Transisi halus untuk sidebar */
        .sidebar-transition {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        /* Efek Gradien Kustom */
        .bg-gradient-gold {
            background: linear-gradient(135deg, #00a1ff 0%, #00a1ff 100%);
        }
        .text-gradient-gold {
            background: linear-gradient(135deg, #00a1ff 0%, #00a1ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        /* Border Gradien untuk Header dan Navigasi */
        .border-gradient-blue-bottom {
            border-bottom: 2px solid;
            border-image-source: linear-gradient(90deg, transparent, #00a1ff, #00a1ff, #00a1ff, transparent);
            border-image-slice: 1;
        }
        
        .border-gradient-blue-top {
            border-top: 2px solid;
            border-image-source: linear-gradient(90deg, transparent, #00a1ff, #00a1ff, #00a1ff, transparent);
            border-image-slice: 1;
        }

        /* Mencegah scroll saat sidebar terbuka */
        .no-scroll {
            overflow: hidden;
        }
        
        /* Animasi rotasi untuk ikon dropdown */
        .rotate-180 {
            transform: rotate(180deg);
        }

        /* Menghilangkan outline biru & delay tap di mobile */
        * {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        /* State aktif saat ditekan (Mobile Native Feel) */
        .btn-active:active {
            background-color: rgba(255, 255, 255, 0.05);
            transform: scale(0.97);
        }
        
        .nav-item-active:active {
            opacity: 0.6;
            transform: scale(0.95);
        }
		
         body {
            background-color: #0f172a;
            color: #e2e8f0;
        }
        .table-container {
            background-color: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }
        tr:nth-child(even) {
            background-color: #1e293b;
        }
        tr:nth-child(odd) {
            background-color: #334155;
        }
        tr:hover {
            background-color: #475569;
            transition: background-color 0.2s ease;
        }
        .search-input {
            background-color: #334155;
            border: 1px solid #475569;
            color: white;
        }
        .search-input:focus {
            border-color: #55d0ef;
            outline: none;
            box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.3);
        }
        /* Custom Gradient Text Class */
        .text-gradient {
            background: linear-gradient(to right, #00a1ff, #00a1ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }		
    </style>

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const isClosed = sidebar.classList.contains('-translate-x-full');

            if (isClosed) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                document.body.classList.add('no-scroll');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
                document.body.classList.remove('no-scroll');
                document.querySelectorAll('[id^="submenu-"]').forEach(el => el.classList.add('hidden'));
                document.querySelectorAll('[id^="arrow-"]').forEach(el => el.classList.remove('rotate-180'));
            }
        }

        function toggleSubmenu(id) {
            const submenu = document.getElementById('submenu-' + id);
            const arrow = document.getElementById('arrow-' + id);
            const isHidden = submenu.classList.contains('hidden');
            
            if (isHidden) {
                submenu.classList.remove('hidden');
                arrow.classList.add('rotate-180');
            } else {
                submenu.classList.add('hidden');
                arrow.classList.remove('rotate-180');
            }
        }

        const tableBody = document.getElementById('tableBody');

        function renderTable(dataToRender) {
            tableBody.innerHTML = '';
            dataToRender.forEach(item => {

                    <tr class="border-b border-slate-700">

        function filterTable() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filteredData = data.filter(item => 
                item.nama.toLowerCase().includes(query) || 
                item.waktu.includes(query)
            );
            renderTable(filteredData);
        }
