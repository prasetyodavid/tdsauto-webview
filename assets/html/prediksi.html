<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PREDIKSI</title> 

<style>
:root{
--bg:#0b0b0b;
--card:linear-gradient(135deg, #0b112b, #1a1f4f, #3a1c71);
--yellow:#c059e8;
--yellow2:#ae00f3;
--text:#f6f6f6;
--muted:#bdbdbd;
}

*{box-sizing:border-box;}

body{
margin:0;
font-family:Arial;
background: linear-gradient(135deg, #0b112b, #1f2a6c, #5f2c82);
color:var(--text);
padding-bottom:80px;
}

/* CONTENT */
.wrap{
max-width:700px;
margin:auto;
padding:20px;
}

/* CARD */
.card{
background:var(--card);
border:1px solid rgba(244,196,48,.2);
border-radius:16px;
padding:20px;
margin-bottom:20px;
}

.marketTitle{
font-size:22px;
font-weight:bold;
color:var(--yellow2);
}

.marketTime{
font-size:12px;
color:var(--muted);
margin-bottom:15px;
}

.divider{
height:1px;
background:#222;
margin:10px 0;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:10px;
}

.box{
background:linear-gradient(135deg, #0b112b, #1a1f4f, #3a1c71);
border-radius:10px;
padding:12px;
text-align:center;
border:1px solid #333;
}

.box span{
display:block;
font-size:11px;
color:var(--muted);
margin-bottom:5px;
}

.box strong{
font-size:18px;
color:var(--yellow2);
letter-spacing:3px;
}

/* BB */
.bb{
margin-top:15px;
background:linear-gradient(135deg, #0b112b, #1a1f4f, #3a1c71);
border-radius:10px;
padding:15px;
border:1px solid #333;
}

.bb h4{
margin:0 0 10px 0;
color:var(--yellow2);
font-size:13px;
}

.bb p{
font-family:monospace;
font-size:14px;
margin:4px 0;
}

.prediksiTanggal{
font-size:12px;
color:#ae00f3;
font-weight:bold;
}

/* BUTTON KUNJUNGI */
.visit-btn{
padding:8px 14px;
background:linear-gradient(#f7d55f,#d8a90b);
border:none;
border-radius:8px;
font-weight:bold;
color:#000;
cursor:pointer;
}

/* POPUP */
.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.7);
display:none;
align-items:center;
justify-content:center;
z-index:9999;
}

.popup.active{
display:flex;
}

.popup-box{
background:#111;
padding:20px;
border-radius:12px;
text-align:center;
width:90%;
max-width:320px;
border:1px solid rgba(244,196,48,.3);
}

.popup-box p{
margin-bottom:20px;
font-size:14px;
}

.popup-actions{
display:flex;
gap:10px;
}

.popup-actions button{
flex:1;
padding:10px;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.btn-cancel{
background:#222;
color:#ccc;
}

.btn-ok{
background:linear-gradient(#f7d55f,#d8a90b);
color:#000;
}

.popup-box{
animation:fadeIn .2s ease;
}

@keyframes fadeIn{
from{transform:scale(.9);opacity:0;}
to{transform:scale(1);opacity:1;}
}

.visit-wrap{
display:flex;
flex-direction:column;
align-items:flex-end;
line-height:1;
}

.partner-text{
font-size:10px;
color:var(--yellow2);
opacity:.8;
margin-bottom:3px;
letter-spacing:.5px;
}

.navbar{
position:fixed;
bottom:0;
left:0;
right:0;
height:70px;
background:#111;
display:flex;
border-top:1px solid #333;
z-index:10;
}

.nav-btn{
flex:1;
display:flex;
align-items:center;
justify-content:center;
font-size:12px;
color:#aaa;
cursor:pointer;
}

.nav-btn.active{
color:#ae00f3;
}

</style>
</head>

<body>

<div class="wrap" id="marketGrid"></div>

<script>
/* ===== RANDOM STABIL ===== */

function seededRandom(seed){
let x=Math.sin(seed)*10000;
return x-Math.floor(x);
}

function getSeedByMarket(name){
let d=new Date();
let str=name+d.getFullYear()+(d.getMonth()+1)+d.getDate();

let hash=0;
for(let i=0;i<str.length;i++){
hash=((hash<<5)-hash)+str.charCodeAt(i);
hash|=0;
}
return Math.abs(hash);
}

function getDigits(count,seed){
let arr=[];
let s=seed;

while(arr.length<count){
let r=Math.floor(seededRandom(s++)*10);
if(!arr.includes(r)) arr.push(r);
}
return arr;
}

function getRand(max,seed){
return Math.floor(seededRandom(seed)*max);
}

/* DATA */

const markets=[
{name:"SYDNEY",time:"Setiap Hari 14:00 WIB"},
{name:"SINGAPORE",time:"Selasa & Jumat (LIBUR) 18:00 WIB"},
{name:"HONGKONG",time:"Setiap Hari 23:00 WIB"}
];

const shioList=["Naga","Ular","Kuda","Kambing","Monyet","Ayam","Anjing","Babi","Tikus","Kerbau","Macan","Kelinci"];

/* GENERATE BB */

function generateLines(pool,len,rows,seed){
let html="";
let s=seed;

for(let i=0;i<rows;i++){
let line=[];
for(let j=0;j<4;j++){
let num="";
for(let k=0;k<len;k++){
num+=pool[Math.floor(seededRandom(s++)*pool.length)];
}
line.push(num);
}
html+=`<p>${line.join(" • ")}</p>`;
}
return html;
}

function getTodayDate(){
let d=new Date();
return d.toLocaleDateString("id-ID");
}

/* RENDER */

function renderMarkets(){

let grid=document.getElementById("marketGrid");

markets.forEach(m=>{

let baseSeed=getSeedByMarket(m.name);

let am=getDigits(4,baseSeed);
let ai=getDigits(2,baseSeed+50);

let pool=[...new Set([...am,...ai])];
let shio=shioList[getRand(12,baseSeed+200)];

let card=document.createElement("div");
card.className="card";

card.innerHTML=`
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
<div class="marketTitle">${m.name}</div>
<div class="prediksiTanggal">PREDIKSI ${getTodayDate()}</div>
</div>

<div class="marketTime">${m.time}</div>

<div class="grid">

<div class="box">
<span>ANGKA MAIN</span>
<strong>${am.join("")}</strong>
</div>

<div class="box">
<span>ANGKA IKUT</span>
<strong>${ai.join("")}</strong>
</div>

<div class="box">
<span>COLOK BEBAS</span>
<strong>${am[0]} • ${am[1]}</strong>
</div>

<div class="box">
<span>SHIO</span>
<strong>${shio}</strong>
</div>

</div>

<div class="divider"></div>

<div class="bb">
<h4>TOP BB 2D</h4>
${generateLines(pool,2,2,baseSeed+100)}

<h4>TOP BB 3D</h4>
${generateLines(pool,3,3,baseSeed+200)}

<h4>TOP BB 4D</h4>
${generateLines(pool,4,3,baseSeed+300)}
</div>
`;

grid.appendChild(card);

});

}

renderMarkets();

</script>

<div class="navbar">
  <div class="nav-btn" onclick="window.location.href='result.html'">RESULT</div>
  <div class="nav-btn" onclick="window.location.href='bukumimpi.html'">BUKU MIMPI</div>
  <div class="nav-btn" onclick="window.location.href='index.html'">HOME</div>
  <div class="nav-btn" onclick="window.location.href='shio.html'">SHIO</div>
  <div class="nav-btn active" onclick="window.location.href='prediksi.html'">PREDIKSI</div>
</div>


</body>
</html>
