        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const isClosed = sidebar.classList.contains('-translate-x-full');

            if (isClosed) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                document.body.classList.add('no-scroll');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
                document.body.classList.remove('no-scroll');
                document.querySelectorAll('[id^="submenu-"]').forEach(el => el.classList.add('hidden'));
                document.querySelectorAll('[id^="arrow-"]').forEach(el => el.classList.remove('rotate-180'));
            }

            const submenu = document.getElementById('submenu-' + id);

                submenu.classList.remove('hidden');
                arrow.classList.add('rotate-180');
            } else {
                submenu.classList.add('hidden');
                arrow.classList.remove('rotate-180');
            }
        }

        function seededRandom(seed) {
            let x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        function getSeed(marketName) {
            const d = new Date();
            const dateStr = `${d.getFullYear()}${d.getMonth()}${d.getDate()}`;
            const combined = marketName + dateStr;
            let hash = 0;
            for (let i = 0; i < combined.length; i++) {
                hash = ((hash << 5) - hash) + combined.charCodeAt(i);
                hash |= 0; 
            }
            return Math.abs(hash);
        }

        function getCombinedPool(amArr, aiArr) {
            return [...new Set([...amArr, ...aiArr])];
        }

        function getSeededDigitsArray(count, seed) {
            let digits = [];
            let currentSeed = seed;
            while(digits.length < count) {
                let r = Math.floor(seededRandom(currentSeed++) * 10);
                if(digits.indexOf(r) === -1) digits.push(r);
            }
            return digits;
        }

        function getSeededNumber(min, max, seed) {
            return Math.floor(seededRandom(seed) * (max - min + 1)) + min;
        }

        function generateLinesFromPool(lineCount, setsPerLine, digitCount, seed, pool) {
            let html = '';
            let currentSeed = seed;
            for(let i=0; i<lineCount; i++) {
                let sets = [];
                for(let j=0; j<setsPerLine; j++) {
                    let num = "";
                    for(let k=0; k<digitCount; k++) {
                        let index = Math.floor(seededRandom(currentSeed++) * pool.length);
                        num += pool[index];
                    }
                    sets.push(num);
                }
                html += `<div class="text-sm font-bold text-white tracking-widest ${i !== lineCount -1 ? 'mb-1' : ''}">${sets.join(' • ')}</div>`;
            }
            return html;
        }

        function getTodayDate() {
            const date = new Date();
            return date.toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit', year: 'numeric' }).replace(/\//g, '-');
        }

        function togglePeek(index) {
            const container = document.getElementById(`bb-peek-${index}`);
            container.classList.toggle('expanded');
        }

        function renderMarkets(filter = "") {
            const grid = document.getElementById('marketGrid');
            grid.innerHTML = "";
            const todayStr = getTodayDate();
            
            // Pengurutan berdasarkan waktu (hour & min)
            const filtered = markets.filter(m => m.name.toLowerCase().includes(filter.toLowerCase()))
                                    .sort((a, b) => (a.hour * 60 + a.min) - (b.hour * 60 + b.min));
            
            filtered.forEach((m, index) => {
                const dailySeed = getSeed(m.name);
                const amArray = getSeededDigitsArray(4, dailySeed);
                const aiArray = getSeededDigitsArray(2, dailySeed + 100);
                const combinedPool = getCombinedPool(amArray, aiArray);

                const cb1 = amArray[0];
                const cb2 = amArray[1];
                const cm1 = `${amArray[0]}${amArray[2]}`;
                const cm2 = `${amArray[1]}${amArray[3]}`;
                const shio = shioList[getSeededNumber(0, 11, dailySeed + 400)];
                
                const bb2dLines = generateLinesFromPool(2, 4, 2, dailySeed + 500, combinedPool);
                const bb3dLines = generateLinesFromPool(3, 3, 3, dailySeed + 600, combinedPool);
                const bb4dLines = generateLinesFromPool(4, 2, 4, dailySeed + 700, combinedPool);

                const card = document.createElement('div');
                card.className = "card-dark p-6 rounded-[2.5rem] shadow-xl flex flex-col gap-2";
                card.onclick = () => togglePeek(index);
                
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <h3 class="font-black text-xl tracking-wider header-gradient">${m.name}</h3>
                            <p class="text-[10px] italic font-bold uppercase tracking-[0.2em] text-slate-100 mt-1 opacity-70">${m.time}</p>
                        </div>
                        <div class="text-right shrink-0 bg-slate-900/50 p-2 rounded-xl border border-slate-700/30">
                            <span class="block text-[7px] font-black text-blue-500 uppercase tracking-[0.3em] mb-1 text-center">PREDIKSI</span>
                            <span class="text-xs font-bold text-white font-mono tracking-tighter">${todayStr}</span>
                        </div>
                    </div>

                    <div class="divider-gradient"></div>

                    <div class="grid grid-cols-2 gap-4 mt-2">
                        <div class="bg-emerald-950/20 p-4 rounded-2xl border border-emerald-500/30 text-center shadow-inner">
                            <span class="block text-[10px] green-gradient mb-2">ANGKA MAIN</span>
                            <span class="text-2xl font-black text-white tracking-[0.3em]">${amArray.join('')}</span>
                        </div>
                        <div class="bg-slate-900/60 p-4 rounded-2xl border border-slate-700/50 text-center shadow-inner">
                            <span class="block text-[10px] header-gradient mb-2">ANGKA IKUT</span>
                            <span class="text-2xl font-black text-white tracking-[0.3em]">${aiArray.join('')}</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-3">
                        <div class="bg-slate-900/40 p-3 rounded-2xl border border-slate-700/30 text-center">
                            <span class="block text-[8px] header-gradient mb-1">COLOK BEBAS</span>
                            <span class="text-base font-bold text-white">${cb1} • ${cb2}</span>
                        </div>
                        <div class="bg-slate-900/40 p-3 rounded-2xl border border-slate-700/30 text-center">
                            <span class="block text-[8px] header-gradient mb-1">COLOK MACAU</span>
                            <span class="text-base font-bold text-white">${cm1}/${cm2}</span>
                        </div>
                        <div class="bg-slate-900/40 p-3 rounded-2xl border border-slate-700/30 text-center">
                            <span class="block text-[8px] header-gradient mb-1">SHIO</span>
                            <span class="text-base font-bold text-white uppercase text-[13px]">${shio}</span>
                        </div>
                    </div>

                    <div id="bb-peek-${index}" class="bb-preview-container px-6 pt-6 pb-2">
                        <div class="peek-gradient-overlay">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-500 glow-arrow animate-bounce-subtle" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 9l-7 7-7-7" />
                            </svg>
                        </div>
                        
                        <div class="flex flex-col gap-8">
                            <div class="text-center">
                                <span class="block text-[10px] header-gradient mb-3">TOP BB 2D</span>
                                ${bb2dLines}
                            </div>
                            <div class="text-center">
                                <span class="block text-[10px] header-gradient mb-3">TOP BB 3D</span>
                                ${bb3dLines}
                            </div>
                            <div class="text-center">
                                <span class="block text-[10px] header-gradient mb-3">TOP BB 4D</span>
                                ${bb4dLines}
                            </div>
                            <div class="flex justify-center pb-2">
                                <div class="bg-slate-800/50 p-2 rounded-full border border-slate-700/50">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-blue-500/50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 15l7-7 7 7" />
                                    </svg>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        document.getElementById('searchInput').oninput = (e) => renderMarkets(e.target.value);
        window.onload = () => renderMarkets();
    </script>
</body>
</html>
