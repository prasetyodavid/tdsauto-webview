                if (window.lucide && window.lucide.icons && window.lucide.icons[name] && iconRef.current) {
                    const iconNode = window.lucide.icons[name];
                    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                    svg.setAttribute("width", size);
                    svg.setAttribute("height", size);
                    svg.setAttribute("viewBox", "0 0 24 24");
                    svg.setAttribute("fill", "none");
                    svg.setAttribute("stroke", "currentColor");
                    svg.setAttribute("stroke-width", "2");
                    svg.setAttribute("stroke-linecap", "round");
                    svg.setAttribute("stroke-linejoin", "round");
                    svg.setAttribute("class", `lucide lucide-${name} ${className}`);
                    iconNode.forEach(([tag, attrs]) => {
                        const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
                        Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
                        svg.appendChild(el);
                    });
                    iconRef.current.innerHTML = '';
                    iconRef.current.appendChild(svg);
                }

                         <button onClick={generate} className="w-full bg-gradient-to-r from-gold-400 to-gold-600 text-black font-bold py-4 rounded-xl uppercase tracking-widest hover:brightness-110 active:scale-95 transition-all shadow-lg">Generate</button>
                         <div className="mt-8 pt-8 border-t border-white/5 text-center">
                             <span className="text-4xl font-display font-black text-transparent bg-clip-text bg-gradient-to-b from-white to-gray-400 tracking-[0.2em]">{res}</span>
                         </div>
                     </div>
                 </div>
             )
        };

        // --- POLA TOOL ---
        const PolaTool = () => {
            const [kepala, setKepala] = useState('');
            const [ekor, setEkor] = useState('');
            const [hasil, setHasil] = useState([]);
            const [copied, setCopied] = useState(false);

            const tarung = () => {
                if(!kepala || !ekor) return;
                const kArr = kepala.replace(/[^0-9]/g, '').split('');
                const eArr = ekor.replace(/[^0-9]/g, '').split('');
                let combinasi = [];
                // Generate Combinations
                kArr.forEach(k => { 
                    eArr.forEach(e => { 
                        combinasi.push(k + e); 
                    }); 
                });
                setHasil([...new Set(combinasi)]);
                setCopied(false);
            };

            const copyText = () => {
                if(hasil.length === 0) return;
                navigator.clipboard.writeText(hasil.join(' '));
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            }
            const reset = () => { setKepala(''); setEkor(''); setHasil([]); }

            return (
                <div className="h-full p-6 pt-8 flex flex-col items-center overflow-y-auto pb-32">
                    <div className="glass-morphism p-6 rounded-3xl w-full max-w-sm animate-slide-up border-t border-gold-500/20">
                        <div className="text-center mb-6">
                            <h2 className="text-xl font-display font-bold text-white tracking-wider flex items-center justify-center gap-2">
                                <Icon name="Grid" size={24} className="text-gold-400" />
                                POLA TARUNG 2D
                            </h2>
                            <p className="text-[10px] text-gray-400 uppercase tracking-widest mt-1">Generator Line Invest</p>
                        </div>
                        <div className="space-y-4 mb-6">
                            <div>
                                <label className="text-[10px] font-bold text-gold-400 uppercase tracking-wider mb-1 block">Kepala (Puluhan)</label>
                                <input type="number" value={kepala} onChange={e=>setKepala(e.target.value)} placeholder="Contoh: 12345" 
                                    className="w-full bg-black/40 border border-white/10 rounded-xl p-3 text-center text-lg text-white outline-none focus:border-gold-500 focus:bg-white/5 transition-all" />
                            </div>
                            <div className="flex justify-center text-gray-500"><Icon name="X" size={16} /></div>
                            <div>
                                <label className="text-[10px] font-bold text-gold-400 uppercase tracking-wider mb-1 block">Ekor (Satuan)</label>
                                <input type="number" value={ekor} onChange={e=>setEkor(e.target.value)} placeholder="Contoh: 67890" 
                                    className="w-full bg-black/40 border border-white/10 rounded-xl p-3 text-center text-lg text-white outline-none focus:border-gold-500 focus:bg-white/5 transition-all" />
                            </div>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={reset} className="flex-1 bg-white/5 border border-white/10 text-gray-300 font-bold py-3 rounded-xl uppercase text-xs tracking-wider hover:bg-white/10 transition-all">Reset</button>
                            <button onClick={tarung} className="flex-[2] bg-gradient-to-r from-gold-400 to-gold-600 text-black font-bold py-3 rounded-xl uppercase text-xs tracking-wider hover:brightness-110 active:scale-95 transition-all shadow-lg">Generate Line</button>
                        </div>
                        {hasil.length > 0 && (
                            <div className="mt-6 pt-6 border-t border-white/5 animate-fade-in">
                                <div className="flex justify-between items-center mb-3">
                                    <span className="text-xs text-gray-400">Total: <strong className="text-white">{hasil.length} Line</strong></span>
                                    <button onClick={copyText} className={`flex items-center gap-1 text-[10px] px-2 py-1 rounded border ${copied ? 'border-green-500 text-green-400 bg-green-500/10' : 'border-gold-500/30 text-gold-400 hover:bg-gold-500/10'}`}>
                                        <Icon name={copied ? "Check" : "Copy"} size={12} /> {copied ? "Disalin" : "Salin"}
                                    </button>
                                </div>
                                <div className="bg-black/60 rounded-xl p-4 text-center border border-white/5 shadow-inner">
                                    <p className="text-lg font-mono text-white tracking-widest leading-relaxed break-words">{hasil.join(' ')}</p>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- APP SHELL ---
        const App = () => {
            const DISCLAIMER_KEY = 'wla_vip_disclaimer_accepted_v1';
            
            // Show disclaimer only once (first app open). Persist with localStorage.
            const [disclaimerAccepted, setDisclaimerAccepted] = useState(() => {
                try {
                    return !!(window.localStorage && window.localStorage.getItem(DISCLAIMER_KEY) === '1');
                } catch (e) {
                    return false;
                }
            });
            
            // State for Promo Banner (akan true saat baru di load asalkan disclaimer sudah disetujui, atau diset ke true begitu dicentang)
            const [showPromo, setShowPromo] = useState(true);

            const [view, setView] = useState('home');
            const [currentTab, setCurrentTab] = useState('live');
            const [currentGroup, setCurrentGroup] = useState('result');

            // --- Efek Tracking Saat Aplikasi Terbuka & Promo Timer ---
            useEffect(() => {
                if (disclaimerAccepted) {                  

                    // Banner Promo Tampil Setiap 5 Menit (300.000 ms)
                    const promoTimer = setInterval(() => {
                        setShowPromo(true);
                    }, 300000);

                    return () => clearInterval(promoTimer);
                }
            }, [disclaimerAccepted]);

            const handleNavigate = (item) => {                
                if (item.type === 'tool_calc') setView('bbfs');
                else if (item.type === 'tool_prediktor') setView('pola');
                else if (item.type === 'master_dashboard') {
                    if (item.tab) setCurrentTab(item.tab);
                    // Pastikan group diset ulang (default 'result') agar tab prediksi tidak nyangkut
                    setCurrentGroup(item.group || 'result'); 
                    setView('dashboard');
                } else setView('home');
            };

            const acceptDisclaimer = () => {
                try {
                    window.localStorage && window.localStorage.setItem(DISCLAIMER_KEY, '1');
                } catch (e) {
                    // ignore (private mode / disabled storage)
                }
                setDisclaimerAccepted(true);
            };

            if (!disclaimerAccepted) {
                return (
                    <div className="h-screen w-full relative">
                        <DisclaimerModal onAccept={acceptDisclaimer} />
                        <div className="flex flex-col h-screen w-full max-w-md mx-auto relative blur-sm opacity-50 pointer-events-none">
                            <Home onNavigate={() => {}} />
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col h-screen w-full max-w-md mx-auto shadow-2xl relative overflow-hidden animate-fade-in">
                    
                    {/* Render Banner Promo jika disetujui/aktif */}
                    {false && <PromoBanner onClose={() => setShowPromo(false)} />}

                    <main className="flex-1 relative overflow-hidden">
                        {view === 'home' && <Home onNavigate={handleNavigate} />}
                        {view === 'bbfs' && <BBFSTool />}
                        {view === 'pola' && <PolaTool />}                    
                        {view === 'dashboard' && <MasterDashboard key={currentTab} initialTab={currentTab} group={currentGroup} />}
                    </main>

                    <div className="absolute bottom-6 left-4 right-4 z-50">
                        <nav className="glass-navbar rounded-2xl px-2 py-2 flex items-center justify-between gap-2 shadow-2xl relative">
                            {MENU_ITEMS.map((item, idx) => {
                                const isActive = (view === 'dashboard' && item.type === 'master_dashboard' && item.group === currentGroup && currentTab !== 'lucky_number') || 
                                               (view === 'bbfs' && item.id === 'bbfs') || 
                                               (view === 'pola' && item.id === 'pola') || 
                                               (view === 'home' && item.id === 'home');
                                
                                return (
                                    <button key={idx} onClick={() => handleNavigate(item)} 
                                        className={`nav-tile flex-1 flex flex-col items-center justify-center h-[54px] rounded-xl group
                                            ${isActive ? 'nav-tile-active' : 'nav-tile-inactive'}`}>
                                        <Icon name={item.icon} size={18} className={`mb-0.5 transition-all ${isActive ? 'text-gold-900' : 'text-gray-400 group-hover:text-gold-400'}`} />
                                        <span className={`text-[8px] font-bold tracking-wider uppercase transition-all ${isActive ? 'text-black' : 'text-gray-500 group-hover:text-gray-300'}`}>
                                            {item.label}
                                        </span>
                                    </button>
                                );
                            })}
                        </nav>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
