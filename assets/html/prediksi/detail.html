<script>

// ambil market dari URL
const urlParams = new URLSearchParams(window.location.search);
const market = urlParams.get("market");

// ambil data pasar
fetch("markets.json")
.then(res=>res.json())
.then(data=>{

let m = data[market];

let p = generatePrediction(market);

document.getElementById("predictionBox").innerHTML = `

<div class="prediksi-container">

<h2 class="market-name">${m.name}</h2>

<div class="tanggal-prediksi">
Prediksi Tanggal<br>
<b>${getTanggal()}</b>
</div>

<div class="main-prediksi">
<div class="label">PREDIKSI UTAMA</div>
<div class="angka-utama">${p.main}</div>
</div>

<div class="prediksi-grid">

<div class="box">
<span>2D</span>
<p>${p.d2}</p>
</div>

<div class="box">
<span>3D</span>
<p>${p.d3}</p>
</div>

<div class="box">
<span>4D</span>
<p>${p.d4}</p>
</div>

</div>

<div class="bbfs-box">

<div class="label">BBFS</div>
<div class="angka-list">${p.bbfs}</div>

</div>

<div class="colok-grid">

<div>
<span>COLOK BEBAS</span>
<p>${p.cb}</p>
</div>

<div>
<span>COLOK NAGA</span>
<p>${p.cn}</p>
</div>

</div>

</div>

`;

});


// ==============================
// GENERATE PREDIKSI HARIAN
// ==============================

function generatePrediction(market){

let seed = market + new Date().toISOString().slice(0,10);

return {

main: seededRandom(seed,5),
d2: seededRandom(seed+"2",2),
d3: seededRandom(seed+"3",3),
d4: seededRandom(seed+"4",4),
bbfs: seededBBFS(seed),
cb: seededRandom(seed+"cb",1),
cn: seededRandom(seed+"cn",2)

};

}


// ==============================
// RANDOM BERDASARKAN SEED
// ==============================

function seededRandom(seed,length){

let num="";
let x = hash(seed);

for(let i=0;i<length;i++){

x = (x * 9301 + 49297) % 233280;
num += Math.floor((x/233280)*10);

}

return num;

}


// ==============================
// BBFS GENERATOR
// ==============================

function seededBBFS(seed){

let nums=[];
let x = hash(seed);

while(nums.length < 6){

x = (x * 9301 + 49297) % 233280;
let r = Math.floor((x/233280)*10);

if(!nums.includes(r)){
nums.push(r);
}

}

return nums.join(" ");

}


// ==============================
// HASH FUNCTION
// ==============================

function hash(str){

let h = 0;

for(let i=0;i<str.length;i++){
h = str.charCodeAt(i) + ((h<<5) - h);
}

return Math.abs(h);

}

function getTanggal(){

const bulan = [
"Januari","Februari","Maret","April","Mei","Juni",
"Juli","Agustus","September","Oktober","November","Desember"
];

let t = new Date();

let hari = t.getDate();
let bln = bulan[t.getMonth()];
let tahun = t.getFullYear();

return hari+" "+bln+" "+tahun;

}
