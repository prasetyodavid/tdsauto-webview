<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">

<title>Prediksi Togel</title>

<style>

.market-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
gap:20px;
margin-top:30px;
}

.market{
background:#160a30;
border:1px solid gold;
border-radius:15px;
padding:20px;
text-align:center;
cursor:pointer;
transition:.3s;
}

.market:hover{
box-shadow:0 0 10px gold;
}

.market img{
width:40px;
margin-bottom:10px;
}

</style>

</head>

<body>


<div class="header">
    <div class="menu-btn" onclick="toggleMenu()">
        <span></span><span></span><span></span>
    </div>
    <div class="header-title">PREDIKSI JITU</div>
    <a href="https://wla.wuaze.com/angkajitu/index.php" class="login-btn">Link JP</a>
</div>

<div class="sidebar" id="sidebar">
    <ul>
        <li>
            <a href="/index.html">Home</a>
        </li>
        <li>
            <a href="/prediksi/index.html">Prediksi</a>
        </li>
        <li>
            <a href="/buku_mimpi.html">Buku Mimpi</a>
        </li>
        <li>
            <a href="/bbfs.html">BBFS Generator</a>
        </li>
        <li>
            <a href="/shio.html">Shio</a>
        </li>
        <li>
            <a href="/lucky.html">Angka Keberuntungan</a>
        </li>
        <li>
            <a href="https://wla.wuaze.com/angkajitu/index.php">Link JP</a>
        </li>
    </ul>
</div>

<div class="sidebar" id="sidebar"></div>

<div class="content">

<h2>Pilih Pasaran Prediksi</h2>

<div id="marketList" class="market-grid"></div>

</div>
<div class="back">
<a href="/index.html">← Kembali</a>
</div>


<script src="../js/app.js"></script>

<script>

fetch("markets.json")
.then(res=>res.json())
.then(data=>{

let html="";

Object.keys(data).forEach(key=>{

let m=data[key];

html+=`
<div class="market" onclick="openMarket('${key}')">
<img src="${m.flag}">
<div>${m.name}</div>
</div>
`;

});

document.getElementById("marketList").innerHTML=html;

});

function openMarket(id){

window.location="detail.html?market="+id;

}



</script>

</body>
</html>
