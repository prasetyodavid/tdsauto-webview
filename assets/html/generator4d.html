        /* Transisi halus untuk sidebar */
        .sidebar-transition {

        /* Efek Gradien Kustom */
        .bg-gradient-gold {

        }
        .text-gradient-gold {
            background: linear-gradient(135deg, #facc15 0%, #f97316 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        /* Mencegah scroll saat sidebar terbuka */

            overflow: hidden;

        /* Animasi rotasi untuk ikon dropdown */

                body {

        .bg-gradient-animate {
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #451a03, #0f172a);

            animation: gradient 15s ease infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Lotto Ball Styles - Dark Theme with Yellow/Orange accent */
        .lotto-ball {
            background: radial-gradient(circle at 30% 30%, #fff7ed, #fbbf24 50%, #f59e0b 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            box-shadow: 
                inset -3px -3px 10px rgba(120, 53, 15, 0.4),
                0 10px 20px -5px rgba(245, 158, 11, 0.3);
            border-radius: 50%;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            border: 2px solid #fef3c7;
            color: #451a03;
        }

        .lotto-ball::after {
            content: '';
            position: absolute;
            top: 15%;
            left: 15%;
            width: 25%;
            height: 25%;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            filter: blur(1px);
        }

        .active-tab {
            background: linear-gradient(to right, #f59e0b, #ea580c);
            color: white !important;
            border-color: transparent;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-down {
            animation: fadeInDown 0.3s ease-out forwards;
        }

        /* Custom Scrollbar for Dark Mode */

            width: 6px;

        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #f59e0b;
        }
    </style>

    <script>
        /* Fungsi Bawaan UI */
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const isClosed = sidebar.classList.contains('-translate-x-full');

            if (isClosed) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                document.body.classList.add('no-scroll');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
                document.body.classList.remove('no-scroll');
                document.querySelectorAll('[id^="submenu-"]').forEach(el => el.classList.add('hidden'));
                document.querySelectorAll('[id^="arrow-"]').forEach(el => el.classList.remove('rotate-180'));
            }
        }

        function toggleSubmenu(id) {
            const submenu = document.getElementById('submenu-' + id);
            const arrow = document.getElementById('arrow-' + id);
            const isHidden = submenu.classList.contains('hidden');
            
            if (isHidden) {
                submenu.classList.remove('hidden');
                arrow.classList.add('rotate-180');
            } else {
                submenu.classList.add('hidden');
                arrow.classList.remove('rotate-180');
            }
        }

        let currentMode = 4;
        let isGenerating = false;
        let historyData = [];

        function switchMode(mode) {
            if (isGenerating) return;
            currentMode = mode;
            
            document.querySelectorAll('button[id^="mode"]').forEach(btn => {
                if(btn.id === 'mode' + mode) {
                    btn.classList.add('active-tab');
                } else {
                    btn.classList.remove('active-tab');
                }
            });
            
            renderBoxes();
        }

        function renderBoxes() {
            const container = document.getElementById('display-container');
            container.innerHTML = '';
            const sizeClass = currentMode > 5 ? 'w-12 h-12 text-2xl' : 'w-14 h-14 text-3xl';
            
            for (let i = 0; i < currentMode; i++) {
                const ball = document.createElement('div');
                ball.className = `lotto-ball ${sizeClass}`;
                ball.innerText = '-';
                container.appendChild(ball);
            }
        }

        async function generate() {
            if (isGenerating) return;
            isGenerating = true;

            const btn = document.getElementById('btn-generate');
            const balls = document.querySelectorAll('.lotto-ball');
            
            btn.innerText = 'MEMPROSES...';
            btn.disabled = true;

            let finalResult = "";

            for (let i = 0; i < balls.length; i++) {
                const duration = 400 + (i * 150);
                
                await new Promise(resolve => {
                    let startTime = Date.now();
                    const timer = setInterval(() => {
                        const rand = Math.floor(Math.random() * 10);
                        balls[i].innerText = rand;
                        balls[i].style.transform = 'scale(1.1)';
                        
                        if (Date.now() - startTime > duration) {
                            clearInterval(timer);
                            balls[i].style.transform = 'scale(1)';
                            finalResult += rand;
                            resolve();
                        }
                    }, 50);
                });
            }

            addToHistory(finalResult, currentMode);
            btn.innerText = 'ACAK ULANG';
            btn.disabled = false;
            isGenerating = false;
        }

        function addToHistory(number, type) {
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
            
            const entry = { number, type, time: timeStr };
            historyData.unshift(entry);
            
            if (historyData.length > 20) historyData.pop();
            
            updateHistoryUI();
        }

        function updateHistoryUI() {
            const historyList = document.getElementById('history-list');
            
            if (historyData.length === 0) {
                historyList.innerHTML = '<p class="text-center text-sm text-slate-500 py-4">Belum ada riwayat angka.</p>';
                return;
            }

            historyList.innerHTML = historyData.map((item) => `
                <div class="flex items-center justify-between p-3 bg-slate-800/40 rounded-xl border border-white/5 animate-fade-in-down">
                    <div class="flex items-center gap-3">
                        <span class="px-2 py-1 bg-gradient-to-r from-yellow-600 to-orange-700 text-white text-[10px] font-bold rounded-md">${item.type}D</span>
                        <span class="text-lg font-black tracking-widest text-yellow-500 font-mono">${item.number}</span>
                    </div>
                    <span class="text-[10px] text-slate-500 font-medium">${item.time}</span>
                </div>
            `).join('');
        }

        function clearHistory() {
            historyData = [];
            updateHistoryUI();
        }

        // Initialize
        window.onload = () => {
            renderBoxes();
            updateHistoryUI();
        };
    </script>
