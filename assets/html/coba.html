<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WLA VIP</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0b0b;
  color:#fff;
}

/* CONTENT */
#content{
  height:calc(100vh - 80px);
  overflow:auto;
}

/* NAVBAR */
.navbar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:70px;
  background:#111;
  display:flex;
  border-top:1px solid #333;
}

.nav-btn{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:12px;
  color:#aaa;
  cursor:pointer;
}

.nav-btn.active{
  color:#f4c430;
}

.loading{
  text-align:center;
  padding:40px;
  color:#f4c430;
}
</style>
</head>

<body>

<div id="content"></div>

<div class="navbar">
  <div class="nav-btn active" onclick="goPage('keluaranwla.html', this)">RESULT</div>
  <div class="nav-btn" onclick="goPage('pola.html', this)">POLA</div>
  <div class="nav-btn" onclick="goPage('home.html', this)">HOME</div>
  <div class="nav-btn" onclick="goPage('bbfs.html', this)">MESIN</div>
  <div class="nav-btn" onclick="goPage('macau.html', this)">PREDIKSI</div>
</div>

<script>

// LOAD PAGE
async function goPage(page, el){
  document.querySelectorAll('.nav-btn').forEach(btn=>btn.classList.remove('active'));
  if(el) el.classList.add('active');

  const content = document.getElementById("content");

  content.innerHTML = "<div class='loading'>Loading...</div>";

  try{
    const res = await fetch(page);
    const html = await res.text();

    const parser = new DOMParser();
    const doc = parser.parseFromString(html, "text/html");

    content.innerHTML = doc.body.innerHTML;

  }catch(e){
    content.innerHTML = "<div class='loading'>Gagal load halaman</div>";
  }
}

// DEFAULT LOAD
goPage('keluaranwla.html');

</script>

</body>
</html>
