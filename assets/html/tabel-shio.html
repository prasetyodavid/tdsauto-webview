    <script>
        /* Fungsi Bawaan UI */
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            const isClosed = sidebar.classList.contains('-translate-x-full');

            if (isClosed) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                document.body.classList.add('no-scroll');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
                document.body.classList.remove('no-scroll');
                document.querySelectorAll('[id^="submenu-"]').forEach(el => el.classList.add('hidden'));
                document.querySelectorAll('[id^="arrow-"]').forEach(el => el.classList.remove('rotate-180'));
            }
        }

        function toggleSubmenu(id) {
            const submenu = document.getElementById('submenu-' + id);
            const arrow = document.getElementById('arrow-' + id);
            const isHidden = submenu.classList.contains('hidden');
            
            if (isHidden) {
                submenu.classList.remove('hidden');
                arrow.classList.add('rotate-180');
            } else {
                submenu.classList.add('hidden');
                arrow.classList.remove('rotate-180');
            }
        }

        const shioCycle = ['Tikus', 'Kerbau', 'Harimau', 'Kelinci', 'Naga', 'Ular', 'Kuda', 'Kambing', 'Monyet', 'Ayam', 'Anjing', 'Babi'];
        
        const shioMeta = {
            'Tikus': { icon: '🐀', sub: 'Air' },
            'Kerbau': { icon: '🐂', sub: 'Tanah' },
            'Harimau': { icon: '🐅', sub: 'Kayu' },
            'Kelinci': { icon: '🐇', sub: 'Kayu' },
            'Naga': { icon: '🐉', sub: 'Tanah' },
            'Ular': { icon: '🐍', sub: 'Api' },
            'Kuda': { icon: '🐎', sub: 'Api' },
            'Kambing': { icon: '🐐', sub: 'Tanah' },
            'Monyet': { icon: '🐒', sub: 'Logam' },
            'Ayam': { icon: '🐓', sub: 'Logam' },
            'Anjing': { icon: '🐕', sub: 'Tanah' },
            'Babi': { icon: '🐖', sub: 'Air' }
        };

        function getYearShio(year) {
            const index = (year - 4) % 12;
            return shioCycle[index];
        }

        function getShioOrder(year) {
            const mainShio = getYearShio(year);
            const mainIdx = shioCycle.indexOf(mainShio);
            let order = [];
            for (let i = 0; i < 12; i++) {
                let idx = (mainIdx - i + 12) % 12;
                order.push(shioCycle[idx]);
            }
            return order;
        }

        function initYearSelector() {
            const select = document.getElementById('yearSelector');
            for (let year = 2026; year >= 2000; year--) {
                const opt = document.createElement('option');
                opt.value = year;
                opt.innerText = `Tahun ${year}`;
                select.appendChild(opt);
            }
        }

        function switchYear(year) {
            const yearNum = parseInt(year);
            const mainShio = getYearShio(yearNum);
            
            document.getElementById('tableTitle').innerText = `Tabel Shio ${yearNum}`;
            document.getElementById('tableSub').innerText = `${mainShio} ${shioMeta[mainShio].sub}`;
            document.getElementById('shioIconLarge').innerText = shioMeta[mainShio].icon;

            const order = getShioOrder(yearNum);
            const tbody = document.getElementById('shioTableBody');
            let html = '';

            order.forEach((name, index) => {
                let numbers = [];
                let current = index + 1;
                while (current <= 100) {
                    let formatted = current === 100 ? "00" : current.toString().padStart(2, '0');
                    numbers.push(formatted);
                    current += 12;
                }

                html += `
                    <tr class="row-shio border-b border-slate-700/30 last:border-none transition-all duration-200">
                        <td class="p-2 text-center font-bold text-slate-600 bg-slate-900/20">${(index + 1).toString().padStart(2, '0')}</td>
                        <td class="p-2">
                            <div class="flex items-center gap-1.5 md:gap-2">
                                <span class="text-lg md:text-2xl">${shioMeta[name].icon}</span>
                                <div class="leading-none">
                                    <span class="font-bold text-slate-200 block text-[10px] md:text-sm">${name}</span>
                                    <span class="hidden md:inline text-[8px] text-slate-500 uppercase tracking-tighter">${shioMeta[name].sub}</span>
                                </div>
                            </div>
                        </td>
                        <td class="p-2">
                            <div class="numbers-grid flex flex-wrap gap-1">
                                ${numbers.map(n => `
                                    <span class="w-7 h-7 md:w-auto md:h-auto flex items-center justify-center bg-slate-800 border border-slate-700 rounded-md font-mono font-bold text-amber-500 text-[10px] md:text-sm shadow-sm">
                                        ${n}
                                    </span>
                                `).join('')}
                            </div>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        initYearSelector();
        switchYear(2026);
    </script>
