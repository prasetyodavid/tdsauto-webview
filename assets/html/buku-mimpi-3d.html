    <style>
        /* Transisi halus untuk sidebar */
        .sidebar-transition {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        /* Efek Gradien Kustom */
        .bg-gradient-gold {
            background: linear-gradient(135deg, #00a1ff 0%, #00a1ff 100%);
        }
        .text-gradient-gold {
            background: linear-gradient(135deg, #00a1ff 0%, #00a1ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        /* Border Gradien untuk Header dan Navigasi */
        .border-gradient-blue-bottom {
            border-bottom: 2px solid;
            border-image-source: linear-gradient(90deg, transparent, #00a1ff, #00a1ff, #00a1ff, transparent);
            border-image-slice: 1;
        }
        
        .border-gradient-blue-top {
            border-top: 2px solid;
            border-image-source: linear-gradient(90deg, transparent, #00a1ff, #00a1ff, #00a1ff, transparent);
            border-image-slice: 1;
        }

        /* Mencegah scroll saat sidebar terbuka */
        .no-scroll {
            overflow: hidden;
        }
        
        /* Animasi rotasi untuk ikon dropdown */
        .rotate-180 {
            transform: rotate(180deg);
        }

        /* Menghilangkan outline biru & delay tap di mobile */
        * {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        /* State aktif saat ditekan (Mobile Native Feel) */
        .btn-active:active {
            background-color: rgba(255, 255, 255, 0.05);
            transform: scale(0.97);
        }
        
        .nav-item-active:active {
            opacity: 0.6;
            transform: scale(0.95);
        }
		
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0c0a09;
            color: #fafaf9;
        }
        
        .bg-gradient-animate {
            background: radial-gradient(circle at 50% -20%, #451a03, #0c0a09 80%);
            background-size: 100% 100%;
        }

        .glass-card {
            background: rgba(38, 38, 38, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(251, 146, 60, 0.1);

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #0c0a09; }
        ::-webkit-scrollbar-thumb { background: #00a1ff; border-radius: 10px; }

                overlay.classList.remove('hidden');

        const listContainer = document.getElementById('listContainer');
        const searchInput = document.getElementById('searchInput');

        const dataObjects = rawData.split('\n').filter(line => line.trim() !== '').map(line => {
            const parts = line.split(/(\d.*)/);
            return {
                text: parts[0].trim(),
                numbers: parts[1] ? parts[1].trim() : ""
            };
        });

        function renderList(items) {
            listContainer.innerHTML = '';
            if (items.length === 0) {
                document.getElementById('noResult').classList.remove('hidden');
                return;
            }
            document.getElementById('noResult').classList.add('hidden');

            items.forEach((item) => {
                const row = document.createElement('div');
                // text-sm dan padding diperkecil agar lebih compact
                row.className = "px-6 py-4 flex justify-between items-center hover:bg-white/5 transition-all group";
                row.innerHTML = `
                    <div class="font-bold text-blue-50 text-sm uppercase tracking-wide group-hover:text-blue-400 transition-colors">${item.text}</div>
                    <div class="flex items-center gap-3 bg-white/5 border border-white/5 px-4 py-2 rounded-xl group-hover:border-blue-500/40 transition-all">
                        <span class="text-blue-500 font-black text-lg">${item.numbers.split(' – ')[0] || ''}</span>
                        <span class="text-white/10 font-thin text-lg">/</span>
                        <span class="text-white/40 font-bold text-lg">${item.numbers.split(' – ')[1] || ''}</span>
                    </div>
                `;
                listContainer.appendChild(row);
            });
        }

        renderList(dataObjects);

        searchInput.addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            const filtered = dataObjects.filter(item => 
                item.text.toLowerCase().includes(val) || 
                item.numbers.includes(val)
            );
            renderList(filtered);
        });
    </script>
