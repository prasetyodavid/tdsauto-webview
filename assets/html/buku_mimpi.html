.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(120px,1fr));

.page{

border:1px solid var(--purple);

}

.page:hover{

}

.page img{

border-radius:5px;
}

.number{
margin-top:5px;
color:#ffd700;
font-weight:bold;
}

.viewer{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:none;
align-items:center;
justify-content:center;
z-index:999;
}

.viewer img{
max-width:95%;
max-height:95%;
}

.close{
position:absolute;
top:20px;
right:25px;
font-size:35px;
cursor:pointer;
color:white;
}

<div class="grid" id="grid"></div>

<div class="viewer" id="viewer">

<div class="close" onclick="tutup()">✕</div>

<img id="img">

</div>

<script>

let grid=document.getElementById("grid");

for(let i=0;i<=99;i++){

let num=i.toString().padStart(2,"0");

let div=document.createElement("div");

div.className="page";

div.innerHTML=`
<img src="buku/${num}.gif">
<div class="number">${num}</div>
`;

div.onclick=function(){

document.getElementById("viewer").style.display="flex";

document.getElementById("img").src=`buku/${num}.gif`;

}

grid.appendChild(div);

}

function tutup(){

document.getElementById("viewer").style.display="none";

}

</script>
