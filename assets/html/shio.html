<script>

const shioData = {
    "Tikus": [ "01","13","25","37","49","61","73","85","97" ],
    "Kerbau": [ "02","14","26","38","50","62","74","86","98" ],
    "Macan": [ "03","15","27","39","51","63","75","87","99" ],
    "Kelinci": [ "04","16","28","40","52","64","76","88","00" ],
    "Naga": [ "05","17","29","41","53","65","77","89" ],
    "Ular": [ "06","18","30","42","54","66","78","90" ],
    "Kuda": [ "07","19","31","43","55","67","79","91" ],
    "Kambing": [ "08","20","32","44","56","68","80","92" ],
    "Monyet": [ "09","21","33","45","57","69","81","93" ],
    "Ayam": [ "10","22","34","46","58","70","82","94" ],
    "Anjing": [ "11","23","35","47","59","71","83","95" ],
    "Babi": [ "12","24","36","48","60","72","84","96" ]
};

function generateShioHTML(){
    let html = '<div class="shio-box"><div class="shio-grid">';
    for(let shio in shioData){
        html += `
        <div class="shio-card">
            <div class="shio-name">${shio}</div>
            <div class="shio-number">${shioData[shio].join(", ")}</div>
        </div>`;
    }
    html += '</div></div>';
    return html;
}

function toggleShio(id){

    const element = document.getElementById(id);

    if(element.style.maxHeight){
        element.style.maxHeight = null;
        element.innerHTML = "";
    } else {

        // Tutup semua dulu
        document.querySelectorAll('.shio-content').forEach(el=>{
            el.style.maxHeight = null;
            el.innerHTML = "";
        });

        element.innerHTML = generateShioHTML();
        element.style.maxHeight = element.scrollHeight + "px";
    }
}

</script>
<script src="js/app.js"></script>
